name: Build Wall

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm clang
      - name: Build Wall
        run: ./build.sh
      - name: Package release tarballs
        run: |
          mkdir -p /tmp/wallpkg
          cp wall libwall.so /tmp/wallpkg/
          tar cJf wall-aarch64.tar.xz -C /tmp/wallpkg wall libwall.so
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wall-aarch64
          path: wall-aarch64.tar.xz
