name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Cross-build and test (aarch64)
    runs-on: ubuntu-latest
    env:
      TARGET: aarch64-unknown-linux-gnu
      SYSROOT: /usr/aarch64-linux-gnu
      TEST_RUNNER: qemu-aarch64 -L /usr/aarch64-linux-gnu

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang llvm gcc-aarch64-linux-gnu libc6-dev-arm64-cross \
            qemu-user-static dpkg-dev

      - name: Build
        run: make

      - name: Test
        run: make test

      - name: Package
        run: make package

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: wall-deb
          path: wall_*.deb
          if-no-files-found: error
